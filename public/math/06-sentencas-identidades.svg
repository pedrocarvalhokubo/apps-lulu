<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t d">
  <title id="t">Sentenças e identidades</title><desc id="d">Quadro visual que diferencia expressão, sentença fechada, sentença aberta e identidade.</desc>
  <rect width="1200" height="780" rx="42" fill="#f7f5ef"/><path d="M0 0h1200v190H0z" fill="#173852"/><circle cx="1070" cy="92" r="105" fill="#20aaa3" opacity=".24"/>
  <text x="70" y="72" fill="#7be1d5" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">CAPÍTULO 9 · MAPA 06</text>
  <text x="70" y="135" fill="white" font-family="Arial,sans-serif" font-size="54" font-weight="800">Que tipo de escrita é esta?</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(70 235)"><rect width="500" height="205" rx="28" fill="#fff" stroke="#d7e1e4" stroke-width="3"/><circle cx="62" cy="55" r="30" fill="#ff865f"/><text x="62" y="64" text-anchor="middle" fill="white" font-size="26" font-weight="800">1</text><text x="112" y="50" fill="#173852" font-size="30" font-weight="800">Expressão</text><text x="38" y="104" fill="#64757d" font-size="21">Não afirma igualdade ou desigualdade.</text><rect x="38" y="133" width="424" height="48" rx="14" fill="#fff0e9"/><text x="250" y="166" text-anchor="middle" fill="#bd5738" font-size="28" font-weight="800">4x + 7</text></g>
    <g transform="translate(630 235)"><rect width="500" height="205" rx="28" fill="#fff" stroke="#d7e1e4" stroke-width="3"/><circle cx="62" cy="55" r="30" fill="#20aaa3"/><text x="62" y="64" text-anchor="middle" fill="white" font-size="26" font-weight="800">2</text><text x="112" y="50" fill="#173852" font-size="30" font-weight="800">Sentença fechada</text><text x="38" y="104" fill="#64757d" font-size="21">Já pode ser julgada verdadeira ou falsa.</text><rect x="38" y="133" width="424" height="48" rx="14" fill="#e5f6f3"/><text x="250" y="166" text-anchor="middle" fill="#087a74" font-size="28" font-weight="800">18 − 5 = 13  ✓</text></g>
    <g transform="translate(70 475)"><rect width="500" height="205" rx="28" fill="#fff" stroke="#d7e1e4" stroke-width="3"/><circle cx="62" cy="55" r="30" fill="#7a65d1"/><text x="62" y="64" text-anchor="middle" fill="white" font-size="26" font-weight="800">3</text><text x="112" y="50" fill="#173852" font-size="30" font-weight="800">Sentença aberta</text><text x="38" y="104" fill="#64757d" font-size="21">Depende do valor da incógnita.</text><rect x="38" y="133" width="424" height="48" rx="14" fill="#eeeafd"/><text x="250" y="166" text-anchor="middle" fill="#5944b5" font-size="28" font-weight="800">3x + 2 = 20  ?</text></g>
    <g transform="translate(630 475)"><rect width="500" height="205" rx="28" fill="#fff" stroke="#d7e1e4" stroke-width="3"/><circle cx="62" cy="55" r="30" fill="#f2b84b"/><text x="62" y="64" text-anchor="middle" fill="#173852" font-size="26" font-weight="800">4</text><text x="112" y="50" fill="#173852" font-size="30" font-weight="800">Identidade</text><text x="38" y="104" fill="#64757d" font-size="21">É verdadeira para todo valor permitido.</text><rect x="38" y="133" width="424" height="48" rx="14" fill="#fff6dc"/><text x="250" y="166" text-anchor="middle" fill="#946b0d" font-size="26" font-weight="800">2(x + 3) = 2x + 6</text></g>
  </g>
  <text x="600" y="735" text-anchor="middle" fill="#173852" font-family="Arial,sans-serif" font-size="22" font-weight="700">DICA: classifique primeiro; resolva somente quando houver algo para descobrir.</text>
</svg>
