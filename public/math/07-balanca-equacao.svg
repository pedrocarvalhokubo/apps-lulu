<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t d">
  <title id="t">A balança da igualdade</title><desc id="d">Roteiro em quatro etapas para resolver uma equação do primeiro grau.</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#173852"/><stop offset="1" stop-color="#245c70"/></linearGradient></defs>
  <rect width="1200" height="780" rx="42" fill="#eef6f4"/><rect x="0" y="0" width="1200" height="200" rx="42" fill="url(#g)"/><text x="70" y="70" fill="#7be1d5" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">CAPÍTULO 9 · MAPA 07</text><text x="70" y="138" fill="white" font-family="Arial,sans-serif" font-size="56" font-weight="800">Equação é uma balança</text>
  <g transform="translate(755 38)" stroke="#ffd477" stroke-width="9" fill="none" stroke-linecap="round"><path d="M170 20v105M70 75h200M90 75l-55 92M250 75l55 92"/><path d="M0 167h70c0 42-70 42-70 0M270 167h70c0 42-70 42-70 0"/><path d="M105 147h130"/></g>
  <g font-family="Arial,sans-serif"><text x="600" y="252" text-anchor="middle" fill="#173852" font-size="32" font-weight="800">3(x + 2) = x + 14</text>
    <g transform="translate(70 305)"><rect width="240" height="270" rx="28" fill="#fff"/><circle cx="45" cy="46" r="28" fill="#ff865f"/><text x="45" y="55" text-anchor="middle" fill="white" font-size="24" font-weight="800">1</text><text x="85" y="52" fill="#173852" font-size="25" font-weight="800">Organize</text><text x="28" y="112" fill="#64757d" font-size="19">Use a distributiva.</text><rect x="28" y="148" width="184" height="72" rx="15" fill="#fff0e9"/><text x="120" y="190" text-anchor="middle" fill="#bd5738" font-size="22" font-weight="800">3x + 6 = x + 14</text></g>
    <path d="M322 440h45" stroke="#20aaa3" stroke-width="8" stroke-linecap="round"/><path d="m355 425 18 15-18 15" fill="none" stroke="#20aaa3" stroke-width="8"/>
    <g transform="translate(380 305)"><rect width="240" height="270" rx="28" fill="#fff"/><circle cx="45" cy="46" r="28" fill="#20aaa3"/><text x="45" y="55" text-anchor="middle" fill="white" font-size="24" font-weight="800">2</text><text x="85" y="52" fill="#173852" font-size="25" font-weight="800">Equilibre</text><text x="28" y="105" fill="#64757d" font-size="18">Subtraia x e 6</text><text x="28" y="130" fill="#64757d" font-size="18">dos dois membros.</text><rect x="28" y="158" width="184" height="62" rx="15" fill="#e5f6f3"/><text x="120" y="197" text-anchor="middle" fill="#087a74" font-size="25" font-weight="800">2x = 8</text></g>
    <path d="M632 440h45" stroke="#20aaa3" stroke-width="8" stroke-linecap="round"/><path d="m665 425 18 15-18 15" fill="none" stroke="#20aaa3" stroke-width="8"/>
    <g transform="translate(690 305)"><rect width="200" height="270" rx="28" fill="#fff"/><circle cx="45" cy="46" r="28" fill="#7a65d1"/><text x="45" y="55" text-anchor="middle" fill="white" font-size="24" font-weight="800">3</text><text x="85" y="52" fill="#173852" font-size="25" font-weight="800">Isole x</text><text x="28" y="112" fill="#64757d" font-size="19">Divida ambos</text><text x="28" y="138" fill="#64757d" font-size="19">os lados por 2.</text><rect x="28" y="165" width="144" height="55" rx="15" fill="#eeeafd"/><text x="100" y="201" text-anchor="middle" fill="#5944b5" font-size="28" font-weight="800">x = 4</text></g>
    <path d="M902 440h45" stroke="#20aaa3" stroke-width="8" stroke-linecap="round"/><path d="m935 425 18 15-18 15" fill="none" stroke="#20aaa3" stroke-width="8"/>
    <g transform="translate(960 305)"><rect width="170" height="270" rx="28" fill="#fff"/><circle cx="45" cy="46" r="28" fill="#f2b84b"/><text x="45" y="55" text-anchor="middle" fill="#173852" font-size="24" font-weight="800">4</text><text x="85" y="52" fill="#173852" font-size="25" font-weight="800">Confira</text><text x="24" y="112" fill="#64757d" font-size="18">Substitua x.</text><rect x="20" y="150" width="130" height="70" rx="15" fill="#fff6dc"/><text x="85" y="181" text-anchor="middle" fill="#946b0d" font-size="18" font-weight="800">18 = 18</text><text x="85" y="207" text-anchor="middle" fill="#087a74" font-size="21" font-weight="800">✓</text></g>
  </g>
  <rect x="180" y="635" width="840" height="75" rx="24" fill="#173852"/><text x="600" y="682" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="24" font-weight="700">Faça a mesma operação nos dois lados. A igualdade agradece.</text>
</svg>
