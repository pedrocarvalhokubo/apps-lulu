<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t d">
  <title id="t">Decifrando historinhas</title><desc id="d">Cinco perguntas que ajudam a transformar um problema escrito em equação.</desc>
  <rect width="1200" height="780" rx="42" fill="#fffaf1"/><path d="M0 0h1200v180H0z" fill="#7a65d1"/><circle cx="1090" cy="68" r="92" fill="#ffcf75" opacity=".35"/><text x="70" y="62" fill="#e8e1ff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">CAPÍTULO 9 · MAPA 08</text><text x="70" y="126" fill="white" font-family="Arial,sans-serif" font-size="54" font-weight="800">Historinha → relação → equação</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(60 230)"><circle cx="70" cy="70" r="70" fill="#ff865f"/><text x="70" y="62" text-anchor="middle" fill="white" font-size="30" font-weight="800">1</text><text x="70" y="95" text-anchor="middle" fill="white" font-size="18" font-weight="700">DESCOBRIR</text><text x="70" y="176" text-anchor="middle" fill="#173852" font-size="21" font-weight="800">O que é x?</text><text x="70" y="205" text-anchor="middle" fill="#65757a" font-size="17">Dê nome e unidade.</text></g>
    <path d="M210 300h55" stroke="#d6cbea" stroke-width="8" stroke-linecap="round"/><path d="m251 285 18 15-18 15" fill="none" stroke="#d6cbea" stroke-width="8"/>
    <g transform="translate(270 230)"><circle cx="70" cy="70" r="70" fill="#20aaa3"/><text x="70" y="62" text-anchor="middle" fill="white" font-size="30" font-weight="800">2</text><text x="70" y="95" text-anchor="middle" fill="white" font-size="18" font-weight="700">MARCAR</text><text x="70" y="176" text-anchor="middle" fill="#173852" font-size="21" font-weight="800">Que relações?</text><text x="70" y="205" text-anchor="middle" fill="#65757a" font-size="17">Total, diferença, dobro…</text></g>
    <path d="M420 300h55" stroke="#d6cbea" stroke-width="8" stroke-linecap="round"/><path d="m461 285 18 15-18 15" fill="none" stroke="#d6cbea" stroke-width="8"/>
    <g transform="translate(480 230)"><circle cx="70" cy="70" r="70" fill="#f2b84b"/><text x="70" y="62" text-anchor="middle" fill="#173852" font-size="30" font-weight="800">3</text><text x="70" y="95" text-anchor="middle" fill="#173852" font-size="18" font-weight="700">TRADUZIR</text><text x="70" y="176" text-anchor="middle" fill="#173852" font-size="21" font-weight="800">Cada personagem?</text><text x="70" y="205" text-anchor="middle" fill="#65757a" font-size="17">Uma informação por vez.</text></g>
    <path d="M630 300h55" stroke="#d6cbea" stroke-width="8" stroke-linecap="round"/><path d="m671 285 18 15-18 15" fill="none" stroke="#d6cbea" stroke-width="8"/>
    <g transform="translate(690 230)"><circle cx="70" cy="70" r="70" fill="#173852"/><text x="70" y="62" text-anchor="middle" fill="white" font-size="30" font-weight="800">4</text><text x="70" y="95" text-anchor="middle" fill="white" font-size="18" font-weight="700">IGUALAR</text><text x="70" y="176" text-anchor="middle" fill="#173852" font-size="21" font-weight="800">O que forma o total?</text><text x="70" y="205" text-anchor="middle" fill="#65757a" font-size="17">Monte a equação.</text></g>
    <path d="M840 300h55" stroke="#d6cbea" stroke-width="8" stroke-linecap="round"/><path d="m881 285 18 15-18 15" fill="none" stroke="#d6cbea" stroke-width="8"/>
    <g transform="translate(900 230)"><circle cx="70" cy="70" r="70" fill="#ff865f"/><text x="70" y="62" text-anchor="middle" fill="white" font-size="30" font-weight="800">5</text><text x="70" y="95" text-anchor="middle" fill="white" font-size="18" font-weight="700">VOLTAR</text><text x="70" y="176" text-anchor="middle" fill="#173852" font-size="21" font-weight="800">Faz sentido?</text><text x="70" y="205" text-anchor="middle" fill="#65757a" font-size="17">Confira e responda.</text></g>
    <rect x="110" y="505" width="980" height="180" rx="30" fill="#fff" stroke="#eadfcd" stroke-width="3"/><text x="150" y="550" fill="#7a65d1" font-size="18" font-weight="800" letter-spacing="2">EXEMPLO</text><text x="150" y="592" fill="#173852" font-size="25" font-weight="700">“Duas caixas têm 30 lápis. A maior tem 6 a mais.”</text><text x="150" y="638" fill="#65757a" font-size="22">menor = x  ·  maior = x + 6</text><rect x="750" y="548" width="290" height="90" rx="22" fill="#eeeafd"/><text x="895" y="604" text-anchor="middle" fill="#5944b5" font-size="30" font-weight="800">x + (x + 6) = 30</text>
  </g>
  <text x="600" y="742" text-anchor="middle" fill="#173852" font-family="Arial,sans-serif" font-size="22" font-weight="800">Não adivinhe a operação: conte a mesma história usando matemática.</text>
</svg>
