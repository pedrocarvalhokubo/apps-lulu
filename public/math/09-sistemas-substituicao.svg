<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t d">
  <title id="t">Sistemas por substituição</title><desc id="d">Roteiro visual do método da substituição em cinco etapas.</desc>
  <rect width="1200" height="780" rx="42" fill="#eef7f5"/><path d="M0 0h1200v185H0z" fill="#087a74"/><text x="70" y="66" fill="#b9f0e9" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">CAPÍTULO 9 · MAPA 09</text><text x="70" y="130" fill="white" font-family="Arial,sans-serif" font-size="54" font-weight="800">Substituição: uma letra de cada vez</text>
  <g font-family="Arial,sans-serif"><rect x="75" y="225" width="340" height="170" rx="28" fill="#173852"/><text x="110" y="270" fill="#7be1d5" font-size="18" font-weight="800">SISTEMA</text><text x="245" y="320" text-anchor="middle" fill="white" font-size="31" font-weight="800">y = x + 2</text><text x="245" y="365" text-anchor="middle" fill="white" font-size="31" font-weight="800">2x + y = 11</text>
    <path d="M440 310h85" stroke="#20aaa3" stroke-width="10" stroke-linecap="round"/><path d="m508 292 22 18-22 18" fill="none" stroke="#20aaa3" stroke-width="10"/>
    <rect x="550" y="225" width="575" height="170" rx="28" fill="#fff" stroke="#cfe4df" stroke-width="3"/><text x="590" y="270" fill="#087a74" font-size="18" font-weight="800">TROQUE y POR x + 2</text><text x="837" y="328" text-anchor="middle" fill="#173852" font-size="35" font-weight="800">2x + (x + 2) = 11</text><text x="837" y="370" text-anchor="middle" fill="#65757a" font-size="22">Agora existe apenas uma incógnita.</text>
    <g transform="translate(75 455)"><rect width="190" height="190" rx="25" fill="#fff"/><circle cx="40" cy="42" r="25" fill="#ff865f"/><text x="40" y="50" text-anchor="middle" fill="white" font-size="22" font-weight="800">1</text><text x="78" y="49" fill="#173852" font-size="22" font-weight="800">Isole</text><text x="24" y="98" fill="#65757a" font-size="18">Escolha a letra</text><text x="24" y="124" fill="#65757a" font-size="18">mais fácil.</text></g>
    <g transform="translate(290 455)"><rect width="190" height="190" rx="25" fill="#fff"/><circle cx="40" cy="42" r="25" fill="#20aaa3"/><text x="40" y="50" text-anchor="middle" fill="white" font-size="22" font-weight="800">2</text><text x="78" y="49" fill="#173852" font-size="22" font-weight="800">Substitua</text><text x="24" y="98" fill="#65757a" font-size="18">Troque pela</text><text x="24" y="124" fill="#65757a" font-size="18">expressão igual.</text></g>
    <g transform="translate(505 455)"><rect width="190" height="190" rx="25" fill="#fff"/><circle cx="40" cy="42" r="25" fill="#7a65d1"/><text x="40" y="50" text-anchor="middle" fill="white" font-size="22" font-weight="800">3</text><text x="78" y="49" fill="#173852" font-size="22" font-weight="800">Resolva</text><text x="24" y="98" fill="#65757a" font-size="18">3x + 2 = 11</text><text x="24" y="132" fill="#5944b5" font-size="24" font-weight="800">x = 3</text></g>
    <g transform="translate(720 455)"><rect width="190" height="190" rx="25" fill="#fff"/><circle cx="40" cy="42" r="25" fill="#f2b84b"/><text x="40" y="50" text-anchor="middle" fill="#173852" font-size="22" font-weight="800">4</text><text x="78" y="49" fill="#173852" font-size="22" font-weight="800">Volte</text><text x="24" y="98" fill="#65757a" font-size="18">y = 3 + 2</text><text x="24" y="132" fill="#946b0d" font-size="24" font-weight="800">y = 5</text></g>
    <g transform="translate(935 455)"><rect width="190" height="190" rx="25" fill="#fff"/><circle cx="40" cy="42" r="25" fill="#173852"/><text x="40" y="50" text-anchor="middle" fill="white" font-size="22" font-weight="800">5</text><text x="78" y="49" fill="#173852" font-size="22" font-weight="800">Confira</text><text x="24" y="98" fill="#65757a" font-size="18">Teste (3,5)</text><text x="24" y="132" fill="#087a74" font-size="24" font-weight="800">nas duas ✓</text></g>
    <rect x="280" y="690" width="640" height="58" rx="20" fill="#173852"/><text x="600" y="728" text-anchor="middle" fill="white" font-size="24" font-weight="800">S = {(3,5)} · ordem do par: (x,y)</text>
  </g>
</svg>
