name: Publicar Estudos da Lulu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Validar site publicado
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Conferir página, prova e infográfico
        shell: bash
        run: |
          set -euo pipefail
          base="https://pedrocarvalhokubo.github.io/apps-lulu"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 "$base/" -o /tmp/index.html
          grep -q "Estudos da Lulu" /tmp/index.html
          script_path="$(grep -oE 'src="/apps-lulu/assets/[^"]+\.js"' /tmp/index.html | head -1 | cut -d'"' -f2)"
          test -n "$script_path"
          curl --fail --silent --show-error --location "$base${script_path#/apps-lulu}" -o /tmp/app.js
          test -s /tmp/app.js
          curl --fail --silent --show-error --location "$base/math/prova-matematica-capitulo-9-lulu.pdf" -o /tmp/prova.pdf
          test "$(wc -c < /tmp/prova.pdf)" -gt 50000
          curl --fail --silent --show-error --location "$base/math/06-sentencas-identidades.svg" -o /tmp/infografico.svg
          grep -q "<svg" /tmp/infografico.svg
